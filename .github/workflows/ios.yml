name: iOS

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CI tools
        run: brew install ripgrep

      - name: Check architecture boundaries
        run: sh Scripts/check-architecture.sh

      - name: Check privacy manifest
        run: sh Scripts/check-privacy-manifest.sh

      - name: Check Swift formatting
        run: xcrun swift-format lint --strict --recursive Packages QuillvaultApp QuillvaultUITests

      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA" HEAD

      - name: Test local packages
        run: |
          swift test --package-path Packages/QuillvaultCore
          swift test --package-path Packages/QuillvaultFeatures
          swift test --package-path Packages/QuillvaultInfrastructure

      - name: Build Debug
        run: >-
          xcodebuild
          -project Quillvault.xcodeproj
          -scheme Quillvault
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/DebugDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify bundled third-party notice
        run: >-
          test -f
          "$RUNNER_TEMP/DebugDerivedData/Build/Products/Debug-iphonesimulator/Quillvault.app/GRDB-LICENSE.txt"

      - name: Verify localized display names
        run: |
          app="$RUNNER_TEMP/DebugDerivedData/Build/Products/Debug-iphonesimulator/Quillvault.app"
          test "$(plutil -extract CFBundleDisplayName raw "$app/Info.plist")" = "Quillvault"
          test "$(plutil -extract CFBundleDisplayName raw "$app/en.lproj/InfoPlist.strings")" = "Quillvault"
          test "$(plutil -extract CFBundleDisplayName raw "$app/zh-Hans.lproj/InfoPlist.strings")" = "墨匣"
          test "$(plutil -extract UIBackgroundModes.0 raw "$app/Info.plist")" = "audio"

      - name: Verify Action Button shortcut metadata
        run: |
          metadata="$RUNNER_TEMP/DebugDerivedData/Build/Products/Debug-iphonesimulator/Quillvault.app/Metadata.appintents/extract.actionsdata"
          test -f "$metadata"
          jq -e '
            .actions.StartFaceToFaceSessionIntent.supportedModes == 2
            and any(
              .autoShortcuts[];
              .actionIdentifier == "StartFaceToFaceSessionIntent"
              and .systemImageName == "record.circle"
            )
          ' "$metadata"

      - name: Build Release
        run: >-
          xcodebuild
          -project Quillvault.xcodeproj
          -scheme Quillvault
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Test Debug launch and top-level navigation
        run: >-
          xcodebuild
          -project Quillvault.xcodeproj
          -scheme Quillvault
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -resultBundlePath "$RUNNER_TEMP/Debug-UI.xcresult"
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Test Release launch and top-level navigation
        run: >-
          xcodebuild
          -project Quillvault.xcodeproj
          -scheme Quillvault
          -configuration Release
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -resultBundlePath "$RUNNER_TEMP/Release-UI.xcresult"
          -skip-testing:QuillvaultUITests/RootNavigationUITests/testRecordingNoticeStartStatusAndStopAreAccessible
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Preserve verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: |
            ${{ runner.temp }}/Debug-UI.xcresult
            ${{ runner.temp }}/Release-UI.xcresult

  main-simulator-matrix:
    if: github.event_name == 'push'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        device:
          - iPhone 16e
          - iPhone 17 Pro
    steps:
      - uses: actions/checkout@v4

      - name: Resolve available simulator
        env:
          DEVICE_NAME: ${{ matrix.device }}
        run: |
          simulator_udid="$(
            xcrun simctl list devices available --json |
              jq -r --arg name "$DEVICE_NAME" '
                [
                  .devices
                  | to_entries[]
                  | .key as $runtime
                  | .value[]
                  | select(.name == $name)
                  | { udid, runtime: $runtime }
                ]
                | sort_by(.runtime)
                | last
                | .udid // empty
              '
          )"
          test -n "$simulator_udid"
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"

      - name: Run UI suite
        run: >-
          xcodebuild
          -project Quillvault.xcodeproj
          -scheme Quillvault
          -configuration Debug
          -destination "platform=iOS Simulator,id=$SIMULATOR_UDID"
          -resultBundlePath "$RUNNER_TEMP/Simulator-UI.xcresult"
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Preserve matrix result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-${{ matrix.device }}
          path: ${{ runner.temp }}/Simulator-UI.xcresult

  release-evidence:
    if: github.event_name == 'push'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Archive unsigned Release
        run: >-
          xcodebuild
          -project Quillvault.xcodeproj
          -scheme Quillvault
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Quillvault.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          archive

      - name: Record package dependency and license evidence
        run: |
          mkdir -p "$RUNNER_TEMP/dependency-evidence"
          swift package --package-path Packages/QuillvaultDesignSystem show-dependencies --format json \
            > "$RUNNER_TEMP/dependency-evidence/design-system.json"
          swift package --package-path Packages/QuillvaultFeatures show-dependencies --format json \
            > "$RUNNER_TEMP/dependency-evidence/features.json"
          swift package --package-path Packages/QuillvaultInfrastructure show-dependencies --format json \
            > "$RUNNER_TEMP/dependency-evidence/infrastructure.json"
          cp ThirdPartyNotices/GRDB-LICENSE.txt \
            "$RUNNER_TEMP/dependency-evidence/GRDB-LICENSE.txt"

      - name: Preserve archive and dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            ${{ runner.temp }}/Quillvault.xcarchive
            ${{ runner.temp }}/dependency-evidence
